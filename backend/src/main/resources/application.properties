spring.config.import=optional:file:.env
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
server.port=${PORT}

# Salud / healthcheck para Railway
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS: coma-separado. Se usan patrones para aceptar cualquier puerto en.
# Por defecto acepta cualquier origen para evitar 502 si la variable no se define.
app.cors.allowed-origins=${APP_CORS_ORIGINS:*}

# Seguridad / JWT
app.jwt.secret=${JWT_SECRET:garepas-secret-cambiar-en-produccion-2026-minimo-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Usuarios iniciales (solo el admin se crea por seeder)
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
