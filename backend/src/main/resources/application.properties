spring.config.import=optional:file:.env
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
# Swagger/OpenAPI deshabilitado por defecto (seguridad). Actívalo en dev: SPRINGDOC_ENABLED=true
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
server.port=${PORT}

# Zona horaria del negocio (Colombia). Los LocalDateTime se guardan en hora de Bogotá.
spring.jackson.time-zone=America/Bogota
spring.jackson.serialization.write-dates-as-timestamps=false

# Salud / healthcheck para Railway
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# CORS: coma-separado. Se usan patrones para aceptar cualquier puerto en.
# Por defecto acepta cualquier origen para evitar 502 si la variable no se define.
app.cors.allowed-origins=${APP_CORS_ORIGINS:*}

# Seguridad / JWT
# OBLIGATORIO en producción: define JWT_SECRET (≥32 caracteres) y ADMIN_PASSWORD en la plataforma.
# Si se dejan por defecto, el arranque falla con mensaje claro (a menos que STRICT_SECRETS=false).
app.jwt.secret=${JWT_SECRET:garepas-secret-cambiar-en-produccion-2026-minimo-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.strict-secrets=${STRICT_SECRETS:true}

# Purga automática de registros antiguos (auditoría e intentos de login)
app.auditoria.retencion-dias=${AUDITORIA_RETENCION_DIAS:90}
app.auditoria.retencion-login-horas=${LOGIN_RETENCION_HORAS:24}
app.auditoria.cron=${PURGA_CRON:0 30 4 * * *}

# Usuarios iniciales (solo el admin se crea por seeder)
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
